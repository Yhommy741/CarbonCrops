; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; shared LoRa packet format + radio settings, and the E220 driver
build_flags =
    -I ../../shared/protocol
    -I ../../shared/drivers
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit INA219 @ ^1.2.3

; Lab test: same gateway + INA219 power logger (PowerLogger.h) measuring the
; sensor node supply. Build/upload with:  pio run -e powerlog -t upload
[env:powerlog]
extends = env:esp32doit-devkit-v1
build_flags =
    ${env:esp32doit-devkit-v1.build_flags}
    -D ENABLE_POWER_LOGGER=1
